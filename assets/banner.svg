<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <circle cx="200" cy="190" r="140" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>
  <circle cx="1000" cy="190" r="150" fill="#ec4899" opacity="0.08" filter="blur(50px)"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="130" height="130" rx="24" fill="#0f172a" stroke="url(#brand)" stroke-width="3"/>
    <circle cx="65" cy="50" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 35 105 C 35 85, 95 85, 95 105" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="95" cy="35" r="7" fill="#ec4899"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="260" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    KiteAI Passport + LayerZero OFT
  </text>
  <text x="260" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Cross-Chain Micropayment Gateway &amp; Idempotent x402 Settlement Infrastructure
  </text>

  <!-- Badges -->
  <g transform="translate(260, 235)">
    <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="67" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Kite Chain 2368</text>

    <rect x="150" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="222" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">LayerZero v2 OFT</text>

    <rect x="310" y="0" width="125" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="372" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">x402 Protocol</text>

    <rect x="450" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <text x="517" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#ec4899" text-anchor="middle">Arbitrum Bridge</text>
  </g>
</svg>
